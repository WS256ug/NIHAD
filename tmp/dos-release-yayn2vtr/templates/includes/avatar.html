{% if photo_url %}
<img class="person-avatar {{ avatar_class }}" src="{{ photo_url }}" alt="" loading="lazy" width="44" height="44">
{% else %}
<span class="person-avatar {{ avatar_class }}" aria-hidden="true">{% if person.first_name %}{{ person.first_name|slice:':1'|upper }}{% else %}{{ person.username|slice:':1'|upper }}{% endif %}{{ person.last_name|slice:':1'|upper }}</span>
{% endif %}
