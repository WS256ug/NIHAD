{% extends form_base_template %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="account-page workspace-card">
  <span class="eyebrow">Account security</span><h1>Change your password</h1>
  <p class="muted">Enter your current password and choose a new one.</p>
  <form method="post" {% include "includes/dialog_form_attributes.html" %}>{% csrf_token %}{% include 'includes/form_fields.html' %}<div class="form-actions"><button type="submit">Change password</button><a href="{% url 'accounts:profile' %}" role="button" class="button outline small">Cancel</a></div></form>
</section>
{% endblock %}
